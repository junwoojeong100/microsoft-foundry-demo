# main 에 push 하면 사이트(영상 + 문서)를 다시 만들어 GitHub Pages 에 배포합니다.
#   · 사이트 소스: site/ · 영상: video/ · 슬라이드(PPTX): slides/ · 문서: docs/  (만드는 방법: scripts/build_site.py)
#   · 처음 한 번만 저장소 Settings → Pages → Source 를 "GitHub Actions" 로 두면 됩니다(이 저장소는 이미 설정돼 있습니다).
name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 배포는 하나씩 — 진행 중인 배포를 끊지 않고 다음 것을 기다립니다.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Build site
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: python scripts/build_site.py --out _site

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
